<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Swift Search — Search anything, from anywhere</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700;1,800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-0: #06091f;
    --bg-1: #0a1130;
    --bg-2: #142154;
    --bg-3: #1d2f6e;
    --line: rgba(255,255,255,0.08);
    --line-2: rgba(255,255,255,0.14);
    --ink-0: #ffffff;
    --ink-1: rgba(255,255,255,0.86);
    --ink-2: rgba(255,255,255,0.62);
    --ink-3: rgba(255,255,255,0.42);
    --blue: #568bfa;
    --blue-bright: #568bfa;
    --blue-soft: #568bfa;
    --blue-deep: #3a68d8;
    --highlight: rgba(86,139,250,0.32);
    --font: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    color: var(--ink-1);
    background: var(--bg-0);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
  }
  ::selection { background: var(--highlight); color: #fff; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
  #root { min-height: 100vh; }

  /* Layout */
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 32px; }

  /* Background scaffold */
  .bg {
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(86,139,250,0.35), transparent 60%),
      radial-gradient(800px 500px at 80% 30%, rgba(29,47,110,0.55), transparent 70%),
      linear-gradient(180deg, #0a1130 0%, #070a22 40%, #06091f 100%);
  }
  .bg::after {
    content: ''; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(ellipse at center top, #000 0%, transparent 70%);
  }

  /* Top nav */
  .nav {
    position: sticky; top: 0; z-index: 50;
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    background: rgba(8, 13, 38, 0.55);
    border-bottom: 1px solid var(--line);
  }
  .nav-inner {
    display: flex; align-items: center; justify-content: space-between;
    height: 68px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .mark { width: 32px; height: 32px; }
  .brand .word {
    font-weight: 800; font-style: italic; font-size: 22px; letter-spacing: -0.01em;
    color: #fff;
  }
  .brand image-slot {
    cursor: pointer;
    border-radius: 8px;
    transition: box-shadow .15s, transform .15s;
  }
  .brand image-slot:hover {
    box-shadow: 0 0 0 2px rgba(86,139,250,0.4), 0 8px 20px -8px rgba(86,139,250,0.5);
    transform: translateY(-1px);
  }
  .logo-uploader {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 9px;
    cursor: pointer;
    transition: box-shadow .15s, transform .15s, background .15s;
    flex-shrink: 0;
  }
  .logo-uploader:hover {
    background: rgba(86,139,250,0.10);
    box-shadow: 0 0 0 2px rgba(86,139,250,0.45), 0 8px 20px -8px rgba(86,139,250,0.5);
    transform: translateY(-1px);
  }
  .logo-uploader.drag-over {
    background: rgba(86,139,250,0.22);
    box-shadow: 0 0 0 2px var(--blue-soft), 0 0 24px rgba(86,139,250,0.5);
  }
  .logo-uploader .lu-overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(8,13,38,0.72);
    color: #fff;
    border-radius: 9px;
    opacity: 0;
    transition: opacity .15s;
    pointer-events: none;
  }
  .logo-uploader:hover .lu-overlay,
  .logo-uploader.drag-over .lu-overlay { opacity: 1; }
  .logo-uploader .lu-clear {
    position: absolute;
    top: -6px; right: -6px;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: #ef4444;
    color: #fff;
    font-size: 14px;
    line-height: 1;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    opacity: 0;
    transition: opacity .15s, transform .15s;
    cursor: pointer;
    border: 0;
  }
  .logo-uploader:hover .lu-clear { opacity: 1; }
  .logo-uploader .lu-clear:hover { transform: scale(1.1); }
  .brand-hint {
    display: inline-flex; align-items: center; gap: 5px;
    margin-left: 4px;
    padding: 4px 9px; border-radius: 999px;
    background: rgba(86,139,250,0.10);
    border: 1px dashed rgba(86,139,250,0.45);
    color: var(--blue-soft);
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.02em;
    opacity: 0.85;
    transition: opacity .15s, background .15s;
    cursor: help;
  }
  .brand:hover .brand-hint { opacity: 1; background: rgba(86,139,250,0.18); }
  .nav-links { display: flex; gap: 28px; }
  .nav-links a {
    font-size: 14.5px; color: var(--ink-2); font-weight: 500;
    transition: color .15s;
  }
  .nav-links a:hover { color: #fff; }
  .nav-cta { white-space: nowrap;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 16px; border-radius: 999px;
    background: #fff; color: #0a1130; font-weight: 700; font-size: 14px;
    transition: transform .15s, box-shadow .15s;
  }
  .nav-cta:hover { transform: translateY(-1px); box-shadow: 0 10px 30px -10px rgba(255,255,255,0.4); }

  /* Hero */
  .hero { padding: 110px 0 60px; text-align: center; position: relative; }
  .hero .eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 14px; border-radius: 999px;
    border: 1px solid rgba(86,139,250,0.45);
    background: rgba(86,139,250,0.10);
    color: var(--blue-soft);
    font-size: 12px; font-weight: 700; letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .hero .eyebrow .dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--blue-soft);
    box-shadow: 0 0 12px var(--blue-soft);
  }
  .hero h1 {
    font-size: clamp(48px, 7.5vw, 104px);
    line-height: 1.02; letter-spacing: -0.035em;
    font-weight: 800; color: #fff;
    margin: 28px 0 0;
  }
  .hero h1 .blue { color: var(--blue-bright); }
  .hero h1 .zoom-in-left {
    display: inline-block;
    transform-origin: left center;
    animation: zoomInLeft 0.75s ease-out both;
  }
  @keyframes zoomInLeft {
    0% {
      opacity: 0;
      transform: translateX(-120vw) scale(0.25);
    }
    50% { opacity: 1; }
    /* arrives */
    55% { transform: translateX(0) scale(1); }
    /* bounce 1 (largest) */
    68% { transform: translateX(22px) scale(1); }
    /* bounce 2 (shorter) */
    82% { transform: translateX(-10px) scale(1); }
    /* bounce 3 (shortest) */
    92% { transform: translateX(4px) scale(1); }
    100% {
      opacity: 1;
      transform: translateX(0) scale(1);
    }
  }
  .hero h1 .zoom-in-right {
    display: inline-block;
    transform-origin: right center;
    /* 0.75s anim + 1s pause after first line finishes = 1.75s delay */
    animation: zoomInRight 0.75s ease-out 1.75s both;
  }
  @keyframes zoomInRight {
    0% {
      opacity: 0;
      transform: translateX(120vw) scale(0.25);
    }
    50% { opacity: 1; }
    /* arrives */
    55% { transform: translateX(0) scale(1); }
    /* bounce 1 (largest) */
    68% { transform: translateX(-22px) scale(1); }
    /* bounce 2 (shorter) */
    82% { transform: translateX(10px) scale(1); }
    /* bounce 3 (shortest) */
    92% { transform: translateX(-4px) scale(1); }
    100% {
      opacity: 1;
      transform: translateX(0) scale(1);
    }
  }
  .hero p.lead {
    margin: 28px auto 0; max-width: 640px;
    font-size: 19px; line-height: 1.55; color: var(--ink-2);
  }
  .hero-ctas { display: flex; gap: 14px; justify-content: center; margin-top: 40px; flex-wrap: wrap; }
  .btn { white-space: nowrap;
    display: inline-flex; align-items: center; gap: 10px;
    padding: 14px 22px; border-radius: 999px; font-weight: 700; font-size: 15px;
    transition: transform .15s, box-shadow .15s, background .15s;
  }
  .btn-primary {
    background: linear-gradient(180deg, #79a6fb 0%, #568bfa 100%);
    color: #fff;
    box-shadow: 0 10px 30px -10px rgba(86,139,250,0.7), inset 0 1px 0 rgba(255,255,255,0.25);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 16px 40px -12px rgba(86,139,250,0.8), inset 0 1px 0 rgba(255,255,255,0.25); }
  .btn-ghost {
    background: rgba(255,255,255,0.06);
    color: #fff;
    border: 1px solid var(--line-2);
  }
  .btn-ghost:hover { background: rgba(255,255,255,0.10); }
  .meta-row {
    margin-top: 22px; display: flex; gap: 22px; justify-content: center;
    color: var(--ink-3); font-size: 13px; flex-wrap: wrap;
  }
  .meta-row span { display: inline-flex; align-items: center; gap: 6px; }

  /* Section header */
  .section { padding: 100px 0; position: relative; }
  .section-head { text-align: center; margin-bottom: 56px; }
  .section-head .kicker, .stats-lead .kicker {
    color: var(--blue-soft); font-size: 12px; font-weight: 700;
    letter-spacing: 0.18em; text-transform: uppercase;
  }
  .section-head h2 {
    margin: 14px 0 0;
    font-size: clamp(36px, 4.8vw, 60px); line-height: 1.05;
    letter-spacing: -0.025em; color: #fff; font-weight: 800;
  }
  .section-head p {
    margin: 18px auto 0; max-width: 620px; color: var(--ink-2); font-size: 17px; line-height: 1.55;
  }

  /* DEMO panel */
  .demo-shell {
    width: 65%;
    margin-inline: auto;
    border-radius: 22px;
    background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
    border: 1px solid var(--line-2);
    box-shadow: 0 40px 80px -30px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.06);
    overflow: hidden;
  }
  .browser-bar {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    background: rgba(0,0,0,0.22);
  }
  .traffic { display: flex; gap: 7px; }
  .traffic span { width: 11px; height: 11px; border-radius: 50%; }
  .traffic span:nth-child(1) { background: #ff5f57; }
  .traffic span:nth-child(2) { background: #febc2e; }
  .traffic span:nth-child(3) { background: #28c840; }
  .url-bar {
    flex: 1; height: 30px; border-radius: 8px;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--line);
    display: flex; align-items: center; gap: 8px; padding: 0 12px;
    color: var(--ink-2); font-size: 12.5px;
    font-family: var(--mono);
  }
  .url-bar .lock { color: var(--blue-soft); }
  .ext-pill {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 4px 10px; border-radius: 999px;
    background: rgba(86,139,250,0.18);
    border: 1px solid rgba(86,139,250,0.4);
    font-size: 11px; font-weight: 700; color: var(--blue-soft);
  }
  .article {
    padding: 44px 56px 56px;
    background:
      radial-gradient(600px 300px at 80% 0%, rgba(86,139,250,0.10), transparent 70%),
      #0c1538;
    color: var(--ink-1);
    line-height: 1.7; font-size: 16.5px;
    min-height: 420px;
    position: relative;
    user-select: text;
  }
  .article h3 {
    font-size: 28px; letter-spacing: -0.02em; color: #fff;
    margin: 0 0 6px; font-weight: 700;
  }
  .article .byline {
    color: var(--ink-3); font-size: 13px; margin-bottom: 22px;
  }
  .article p { margin: 0 0 16px; }
  .article p::selection,
  .article h3::selection { background: var(--highlight); color: #fff; }
  .compat-section h2 {
    font-family: var(--font);
    font-size: clamp(28px, 4vw, 48px);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.1;
    color: var(--ink-0);
    margin: 0 0 16px;
  }
  .compat-section p {
    font-family: var(--font);
    font-size: 17px;
    line-height: 1.65;
    color: var(--ink-2);
    max-width: 560px;
    margin: 0 auto;
  }
  /* COMPATIBILITY STRIP */
  .compat-section {
    padding: 80px 0 60px;
    overflow: hidden;
  }
  .compat-stage {
    display: flex;
    flex-direction: column;
    gap: 16px;
    overflow: hidden;
    mask-image: linear-gradient(to right, transparent 0%, black 8%, black 92%, transparent 100%);
    -webkit-mask-image: linear-gradient(to right, transparent 0%, black 8%, black 92%, transparent 100%);
  }
  .compat-track {
    display: flex;
    gap: 14px;
    width: max-content;
    animation: marqueeLeft 32s linear infinite;
  }
  .compat-track--rev {
    animation: marqueeRight 36s linear infinite;
  }
  @keyframes marqueeLeft {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }
  @keyframes marqueeRight {
    from { transform: translateX(-50%); }
    to   { transform: translateX(0); }
  }
  .compat-chip {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 18px;
    border-radius: 40px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.09);
    white-space: nowrap;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-2);
    flex-shrink: 0;
    transition: background .15s, color .15s;
  }
  .compat-chip:hover {
    background: rgba(86,139,250,0.10);
    color: var(--ink-1);
  }

  /* DEMO video (replaces interactive article) */
  .demo-video {
    aspect-ratio: 16 / 9;
    background: #0c1538;
    display: flex;
    width: 100%;
  }
  .demo-video-el {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
    background: #0c1538;
  }
  .video-placeholder {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    color: var(--ink-3);
    background:
      radial-gradient(600px 300px at 80% 0%, rgba(86,139,250,0.10), transparent 70%),
      repeating-linear-gradient(135deg, rgba(255,255,255,0.025) 0 14px, transparent 14px 28px),
      #0c1538;
  }
  .video-placeholder .vp-play {
    width: 64px; height: 64px; border-radius: 50%;
    display: grid; place-items: center;
    font-size: 22px; color: var(--blue-soft);
    background: rgba(86,139,250,0.14);
    border: 1px solid rgba(86,139,250,0.4);
    padding-left: 4px;
  }
  .video-placeholder .vp-label {
    font-family: var(--mono); font-size: 13px; letter-spacing: 0.04em;
    text-transform: uppercase; color: var(--ink-2);
  }
  .video-placeholder .vp-hint {
    font-family: var(--mono); font-size: 12px; color: var(--ink-3);
  }
  .video-placeholder .vp-hint code {
    color: var(--blue-soft);
    background: rgba(86,139,250,0.12);
    padding: 2px 6px; border-radius: 5px;
  }
  .hint-pill {
    position: absolute; top: 18px; right: 18px;
    display: inline-flex; gap: 8px; align-items: center;
    padding: 6px 12px; border-radius: 999px;
    background: rgba(0,0,0,0.4); border: 1px dashed rgba(86,139,250,0.5);
    color: var(--blue-soft); font-size: 12px; font-weight: 600;
  }
  /* Floating popup that appears after selection */
  .swift-popup {
    position: absolute; z-index: 30;
    background: #0e1840;
    border: 1px solid rgba(86,139,250,0.5);
    border-radius: 14px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.7), 0 0 0 4px rgba(86,139,250,0.08);
    padding: 10px;
    min-width: 260px;
    animation: popIn .18s ease-out;
    transform-origin: top left;
  }
  @keyframes popIn {
    from { opacity: 0; transform: translateY(-4px) scale(.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .swift-popup .pop-head {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 8px 10px;
    color: var(--ink-3); font-size: 11px; font-weight: 600; letter-spacing: 0.04em;
    border-bottom: 1px solid var(--line);
    margin-bottom: 6px;
  }
  .swift-popup .pop-head .q {
    color: #fff; font-weight: 700; font-size: 13px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 200px;
  }
  .swift-popup .engines { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; }
  .swift-popup .engine {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 10px; border-radius: 9px;
    transition: background .12s;
    text-align: left;
  }
  .swift-popup .engine:hover { background: rgba(86,139,250,0.18); }
  .swift-popup .engine .ico {
    width: 22px; height: 22px; border-radius: 6px;
    display: grid; place-items: center;
    font-weight: 800; font-size: 11px;
    color: #fff;
    flex-shrink: 0;
  }
  .swift-popup .engine .name {
    font-size: 13px; color: #fff; font-weight: 600;
  }
  .swift-popup .pop-foot {
    margin-top: 6px; padding: 8px 8px 4px;
    color: var(--ink-3); font-size: 11px;
    display: flex; justify-content: space-between; align-items: center;
    border-top: 1px solid var(--line);
  }
  .kbd {
    display: inline-flex; align-items: center; padding: 1px 6px;
    border: 1px solid var(--line-2); border-radius: 5px;
    font-family: var(--mono); font-size: 10.5px; color: var(--ink-2);
    background: rgba(255,255,255,0.04);
  }

  /* Result tabs */
  .result-overlay {
    position: absolute; inset: 0;
    background: rgba(6,9,31,0.85);
    backdrop-filter: blur(8px);
    display: flex; flex-direction: column;
    animation: fadeIn .25s ease-out;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .result-head {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 18px; border-bottom: 1px solid var(--line);
    background: rgba(0,0,0,0.3);
  }
  .result-head .close {
    margin-left: auto; padding: 6px 10px; border-radius: 8px;
    background: rgba(255,255,255,0.06); color: #fff; font-size: 12px; font-weight: 600;
  }
  .result-head .close:hover { background: rgba(255,255,255,0.12); }
  .result-body { padding: 28px 32px; overflow: auto; }
  .result-tile {
    padding: 16px 18px; border: 1px solid var(--line); border-radius: 12px;
    margin-bottom: 12px;
    background: rgba(255,255,255,0.02);
    transition: border-color .15s, background .15s;
  }
  .result-tile:hover { border-color: var(--line-2); background: rgba(255,255,255,0.04); }
  .result-tile .rt-url { color: var(--blue-soft); font-size: 12px; font-family: var(--mono); }
  .result-tile .rt-title { color: #fff; font-size: 16px; font-weight: 600; margin: 4px 0 6px; }
  .result-tile .rt-snippet { color: var(--ink-2); font-size: 13.5px; line-height: 1.55; }

  /* the stats read as a quiet footnote to the three steps, not a second section */
  .stats-block {
    margin-top: 40px; padding-top: 28px;
    border-top: 1px solid var(--line);
    display: flex; align-items: baseline; justify-content: center;
    gap: 40px; flex-wrap: wrap;
  }
  .stats-lead { font-size: 14px; color: var(--ink-3); margin: 0; }
  .stats-block .stats {
    display: flex; gap: 40px; background: none; border: none;
    border-radius: 0; overflow: visible; flex-wrap: wrap;
  }

  /* Feature grid */
  .features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .feature-groups { display: grid; gap: 46px; }
  .feature-group { display: grid; gap: 0; }
  .group-label {
    display: flex; align-items: center; gap: 14px;
    font-size: 12px; font-weight: 700; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--blue-soft);
  }
  .group-label::before {
    content: ''; width: 7px; height: 7px; border-radius: 50%;
    background: var(--blue); flex-shrink: 0;
    box-shadow: 0 0 0 3px rgba(86,139,250,0.16);
  }
  .group-label::after { content: ''; flex: 1; height: 1px; background: var(--line); }
  /* node lines: trunk down from the heading node, a bus across the row, a drop into each card */
  .node-bus { position: relative; height: 34px; z-index: 0; }
  .node-bus::before {
    content: ''; position: absolute; left: 3px; top: 0; bottom: 17px;
    width: 1px; background: var(--line-2);
  }
  .node-bus::after {
    content: ''; position: absolute; left: 3px; right: calc((100% - 36px) / 6);
    bottom: 17px; height: 1px; background: var(--line-2);
  }
  .node-drop {
    position: absolute; top: 17px; bottom: 0; width: 1px;
    background: var(--line-2);
  }
  .feature-group .features + .node-bus { height: 40px; }
  .feature-group .features + .node-bus::before,
  .feature-group .features + .node-bus::after { display: none; }
  .feature-group .features + .node-bus .node-drop { top: 0; }
  .feature {
    position: relative; z-index: 1;
    border: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01)), #070c22;
    padding: 28px;
    border-radius: 18px;
    transition: border-color .22s ease, transform .22s ease, box-shadow .22s ease, background .22s ease;
  }
  .feature:hover {
    border-color: rgba(86,139,250,0.45);
    background: linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02)), #070c22;
    transform: translateY(-12px);
    box-shadow: 0 34px 60px -20px rgba(2,5,18,0.95), 0 0 0 1px rgba(86,139,250,0.1);
  }
  .feature .ico {
    width: 42px; height: 42px; border-radius: 11px;
    background: linear-gradient(180deg, rgba(86,139,250,0.25), rgba(86,139,250,0.1));
    border: 1px solid rgba(86,139,250,0.35);
    display: grid; place-items: center;
    color: var(--blue-soft);
    margin-bottom: 18px;
  }
  .feature h4 { margin: 0 0 8px; font-size: 18px; color: #fff; font-weight: 700; letter-spacing: -0.01em; }
  .feature p { margin: 0; color: var(--ink-2); font-size: 14.5px; line-height: 1.55; }

  /* Steps */
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .step {
    padding: 28px; border-radius: 18px;
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.02);
    position: relative;
  }
  .step .num {
    font-family: var(--mono); font-size: 12px; color: var(--blue-soft);
    letter-spacing: 0.1em;
  }
  .step h4 { color: #fff; font-size: 22px; margin: 8px 0 10px; letter-spacing: -0.015em; }
  .step p { color: var(--ink-2); margin: 0; line-height: 1.55; }

  /* Engines / customization */
  .engines-shell {
    display: grid; grid-template-columns: 1.55fr 1fr; gap: 24px;
    align-items: stretch;
  }
  .engines-list, .engines-preview {
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.02);
    border-radius: 18px;
    padding: 22px;
  }
  .engines-list {
    border: none;
    background: transparent;
    padding: 0;
    overflow: hidden;
  }
  .engines-list h5, .engines-preview h5 {
    margin: 0 0 4px; color: #fff; font-size: 16px; font-weight: 700;
  }
  .engines-list .hint, .engines-preview .hint {
    color: var(--ink-3); font-size: 13px; margin-bottom: 18px;
  }
  .engine-row {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; margin-bottom: 8px;
    border-radius: 10px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--line);
    transition: background .15s, border-color .15s;
  }
  .engine-row.on { border-color: rgba(86,139,250,0.4); background: rgba(86,139,250,0.10); }
  .engine-row .grab { color: var(--ink-3); cursor: grab; }
  .engine-row .ico {
    width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center;
    font-weight: 800; font-size: 12px; color: #fff;
  }
  .engine-row .label { flex: 1; color: #fff; font-size: 14px; font-weight: 600; }
  .engine-row .url { color: var(--ink-3); font-size: 11.5px; font-family: var(--mono); }
  /* Toggle */
  .switch {
    width: 38px; height: 22px; border-radius: 999px;
    background: rgba(255,255,255,0.12); position: relative; transition: background .2s;
    flex-shrink: 0;
  }
  .switch::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 18px; height: 18px; border-radius: 50%; background: #fff;
    transition: transform .2s;
  }
  .switch.on { background: var(--blue); }
  .switch.on::after { transform: translateX(16px); }

  /* Shortcut playground */
  .shortcut-card {
    border: 1px solid var(--line);
    border-radius: 18px;
    background: linear-gradient(180deg, rgba(86,139,250,0.06), rgba(255,255,255,0.01));
    padding: 36px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 36px; align-items: center;
  }
  .shortcut-card .copy h3 { margin: 0 0 12px; color: #fff; font-size: 28px; letter-spacing: -0.02em; }
  .shortcut-card .copy p { color: var(--ink-2); line-height: 1.6; font-size: 15.5px; }
  .keys { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
  .key {
    padding: 12px 18px; border-radius: 12px;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--line-2);
    color: #fff; font-family: var(--mono); font-size: 14px; font-weight: 600;
    box-shadow: inset 0 -2px 0 rgba(0,0,0,0.3);
    transition: transform .12s, background .12s, border-color .12s;
  }
  .key.pressed {
    background: var(--blue);
    border-color: var(--blue-soft);
    transform: translateY(2px);
    box-shadow: inset 0 -1px 0 rgba(0,0,0,0.2), 0 0 24px rgba(86,139,250,0.5);
  }
  .key-input {
    width: 100%; padding: 14px 18px;
    border-radius: 12px;
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--line-2);
    color: #fff; font-family: var(--mono); font-size: 14px;
    outline: none;
    transition: border-color .15s;
  }
  .key-input:focus { border-color: var(--blue-soft); }

  /* Testimonials */
  .reviews { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .review {
    padding: 26px; border-radius: 16px;
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.02);
  }
  .review .stars { color: #fdba74; letter-spacing: 2px; font-size: 14px; }
  .review p {
    margin: 12px 0 16px; color: var(--ink-1); font-size: 15px; line-height: 1.55;
  }
  .review .author {
    display: flex; align-items: center; gap: 10px;
  }
  .review .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    display: grid; place-items: center;
    color: #fff; font-weight: 700; font-size: 12px;
  }
  .review .who { font-size: 13px; color: var(--ink-2); }
  .review .who strong { color: #fff; display: block; }

  /* Stats */
  .stats {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 1px; background: var(--line);
    border-radius: 18px; overflow: hidden;
    border: 1px solid var(--line);
  }
  .stat {
    padding: 32px 28px 28px; background: #0a1130;
    text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    position: relative;
  }
  .stat-icon {
    margin-bottom: 4px;
    opacity: 0.9;
  }
  .stat-ico {
    display: inline-flex; align-items: center; justify-content: center;
    width: 48px; height: 48px; margin-top: 14px;
    border-radius: 12px;
    background: rgba(86,139,250,0.10);
    border: 1px solid rgba(86,139,250,0.22);
  }
  .stat-number { position: relative; }
  .stat .n {
    font-size: 48px; font-weight: 800; color: #fff; letter-spacing: -0.03em;
    font-feature-settings: 'tnum';
    display: block;
  }
  .stat-glow-bar {
    width: 70%; height: 2px; border-radius: 999px;
    margin: 2px auto 0;
    opacity: 0.75;
  }
  .stat .l { color: var(--ink-3); font-size: 13px; margin-top: 6px; }
  .stats-block .stat {
    padding: 0; background: none; text-align: left;
    display: flex; flex-direction: row; align-items: baseline; gap: 4px;
  }
  .stats-block .stat .stat-number { display: inline-flex; }
  .stats-block .stat .n { font-size: 22px; font-weight: 700; display: inline; color: var(--blue-soft); }
  .stats-block .stat .l { margin-top: 0; font-size: 14px; color: var(--ink-2); }
  .stats-block .stat .suf { font-size: 14px; font-weight: 400; color: var(--ink-2); margin-left: 4px; }

  /* FAQ */
  .faq-list { max-width: 760px; margin: 0 auto; }
  .faq-item {
    border-bottom: 1px solid var(--line);
    padding: 4px 0;
  }
  .faq-q {
    width: 100%; text-align: left;
    display: flex; justify-content: space-between; align-items: center;
    padding: 20px 4px; color: #fff;
    font-size: 17px; font-weight: 600; letter-spacing: -0.005em;
  }
  .faq-q:hover { color: var(--blue-soft); }
  .faq-q .chev {
    width: 26px; height: 26px; border-radius: 50%;
    background: rgba(255,255,255,0.06);
    display: grid; place-items: center;
    transition: transform .2s, background .2s;
    color: var(--ink-2);
  }
  .faq-item.open .faq-q .chev { transform: rotate(45deg); background: var(--blue); color: #fff; }
  .faq-a {
    overflow: hidden; max-height: 0;
    transition: max-height .25s ease, padding .25s;
    color: var(--ink-2); line-height: 1.6; font-size: 15px;
    padding: 0 4px;
  }
  .faq-item.open .faq-a { max-height: 240px; padding: 0 4px 22px; }

  /* CTA banner */
  .cta-banner {
    padding: 60px 48px;
    border-radius: 24px;
    background:
      radial-gradient(800px 300px at 20% 0%, rgba(86,139,250,0.18), transparent 60%),
      linear-gradient(180deg, #0e1c4d 0%, #0a1130 100%);
    border: 1px solid rgba(86,139,250,0.22);
    text-align: center;
    box-shadow: 0 40px 80px -30px rgba(10,17,48,0.6);
  }
  .cta-banner h3 {
    margin: 0 0 16px; color: #fff;
    font-size: clamp(32px, 4vw, 48px); letter-spacing: -0.025em; line-height: 1.05;
  }
  .cta-banner p {
    color: var(--ink-2); max-width: 540px; margin: 0 auto 28px; font-size: 16.5px; line-height: 1.55;
  }

  /* Footer */
  footer {
    margin-top: 60px; padding: 50px 0 40px;
    border-top: 1px solid var(--line);
  }
  .foot-grid {
    display: grid; grid-template-columns: 1.6fr 1fr 1fr; gap: 36px;
    margin-bottom: 40px;
  }
  .foot-grid h6 {
    color: #fff; margin: 0 0 16px; font-size: 13px;
    text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700;
  }
  .foot-grid a, .foot-grid li {
    display: block; color: var(--ink-2); font-size: 14px; padding: 4px 0;
    list-style: none;
  }
  .foot-grid a:hover { color: #fff; }
  .foot-grid ul { padding: 0; margin: 0; }
  .foot-bottom {
    display: flex; justify-content: space-between; align-items: center;
    color: #808080; font-size: 13px;
    padding-top: 24px; border-top: 1px solid var(--line);
    gap: 16px;
    position: relative;
  }
  .sinope-credit {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 5px 10px; border: 1px solid rgba(157,180,212,0.32);
    border-radius: 12px; background: rgba(157,180,212,0.20);
    color: var(--ink-2);
    font-size: 12px; font-weight: 600; letter-spacing: 0.04em;
    text-transform: uppercase;
    transition: background .15s, color .15s;
  }
  .sinope-credit-plain {
    display: inline-flex; align-items: center; gap: 0px;
    color: #808080;
    position: absolute; left: 50%; top: calc(50% + 12px); transform: translate(-50%, -50%);
  }
  .sinope-credit-plain:hover { color: #808080; }
  .sinope-credit-plain img {
    height: 56px; width: auto; display: block; margin-left: -4px;
  }

  @media (max-width: 880px) {
    .features, .steps, .reviews { grid-template-columns: 1fr; }
    .node-bus { display: none; }
    .feature-group { gap: 20px; }
    .stats { grid-template-columns: 1fr; }
    .stats-block, .stats-block .stats { gap: 18px 28px; }
    .engines-shell, .shortcut-card { grid-template-columns: 1fr; }
    .nav-links { display: none; }
    .article { padding: 28px 24px; }
    .foot-grid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
